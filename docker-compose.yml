services:
  dapp:
    build:
      context: .
      args:
        VITE_CONTRACT_ID: ${VITE_CONTRACT_ID:-CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2S2QW3EY5XFG2L3UQP}
        VITE_NETWORK_PASSPHRASE: ${VITE_NETWORK_PASSPHRASE:-Test SDF Network ; quorum-test}
        VITE_RPC_URL: ${VITE_RPC_URL:-https://rpc.testnet.stellar.org}
        VITE_HORIZON_URL: ${VITE_HORIZON_URL:-https://horizon-testnet.stellar.org}
        VITE_USDC_TOKEN: ${VITE_USDC_TOKEN:-CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2S2QW3EY5XFG2L3UQP}
        VITE_REGULATOR_ADDRESS: ${VITE_REGULATOR_ADDRESS:-GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA7}
    # The container runs as a non-root nginx user and listens on 8080.
    ports:
      - '8080:8080'
    restart: unless-stopped
    # Reap orphaned processes (prevents zombie accumulation in long-running containers).
    init: true
    # Surface container health to `docker compose ps` / orchestrators.
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
