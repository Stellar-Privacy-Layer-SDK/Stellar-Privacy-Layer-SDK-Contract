name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'
  RUST_CHANNEL: stable

# All third-party actions are pinned to the exact commit of a released major
# version tag (supply-chain hardening). Dependabot keeps them current.
jobs:
  rust:
    name: Rust (contract + prover)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1.13.0
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: '. -> target'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint (clippy, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build contract (wasm32)
        run: cargo build -p stellar-privacy-contract --target wasm32-unknown-unknown --locked

      - name: Build prover
        run: cargo build -p stellar-privacy-prover --locked

      - name: Run Rust tests
        run: cargo test --all-features --locked

      - name: Upload contract wasm artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stellar-privacy-contract.wasm
          path: target/wasm32-unknown-unknown/debug/stellar_privacy_contract.wasm
          if-no-files-found: error
          retention-days: 7

  typescript:
    name: TypeScript (sdk + selective-disclosure + dapp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome, warnings fail the build)
        run: npm run lint

      - name: Format check (biome)
        run: npm run format:check

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Build all packages
        run: npm run build:all

      - name: Test with coverage gates (>=80% statements/lines/functions)
        run: npm run test:coverage

      - name: Upload dapp build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dapp-dist
          path: packages/dapp/dist
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security (npm audit + cargo audit + cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit — production dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: cargo audit — RustSec advisory database
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1

      - name: cargo deny — licenses, bans, advisories
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check

  # Aggregate status badge gate: keeps a single green/red signal for the repo.
  status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [rust, typescript, security]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.rust.result }}" != "success" || "${{ needs.typescript.result }}" != "success" || "${{ needs.security.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
