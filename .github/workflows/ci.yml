name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'
  RUST_CHANNEL: stable

jobs:
  rust:
    name: Rust (contract + prover)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_CHANNEL }}
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint (clippy, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build contract (wasm32)
        run: cargo build -p stellar-privacy-contract --target wasm32-unknown-unknown --locked

      - name: Build prover
        run: cargo build -p stellar-privacy-prover --locked

      - name: Run Rust tests
        run: cargo test --all-features --locked

      - name: Upload contract wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-privacy-contract.wasm
          path: target/wasm32-unknown-unknown/debug/stellar_privacy_contract.wasm
          if-no-files-found: error

  typescript:
    name: TypeScript (sdk + selective-disclosure + dapp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Format check (biome)
        run: npm run format:check

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Build all packages
        run: npm run build:all

      - name: Test with coverage gates (>=80% statements/lines/functions)
        run: npm run test:coverage

      - name: Upload dapp build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dapp-dist
          path: packages/dapp/dist
          if-no-files-found: error

  # Aggregate status badge gate: keeps a single green/red signal for the repo.
  status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [rust, typescript]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.rust.result }}" != "success" || "${{ needs.typescript.result }}" != "success" ]]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
